<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pravimal Hridhan | Premium Portfolio</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

:root{
--bg:#0d081f;
--card:#16102f;
--primary:#7c3aed;
--secondary:#06b6d4;
--pink:#ec4899;
--text:#ffffff;
--text2:#bcbcbc;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
scroll-behavior:smooth;
}

body{
background:var(--bg);
color:var(--text);
overflow-x:hidden;
}

/* Background Grid */

body::before{
content:'';
position:fixed;
inset:0;
background:
linear-gradient(rgba(6,182,212,.08) 1px, transparent 1px),
linear-gradient(90deg, rgba(6,182,212,.08) 1px, transparent 1px);
background-size:50px 50px;
z-index:-2;
}

/* Animated Glow */

body::after{
content:'';
position:fixed;
width:700px;
height:700px;
background:radial-gradient(circle,
rgba(124,58,237,.25),
transparent 70%);
top:-200px;
right:-200px;
z-index:-1;
animation:float 8s infinite alternate;
}

@keyframes float{
from{
transform:translateY(0);
}
to{
transform:translateY(60px);
}
}

/* NAVBAR */

nav{
position:fixed;
top:0;
left:0;
width:100%;
padding:20px 8%;
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(0,0,0,.3);
backdrop-filter:blur(15px);
z-index:1000;
}

.logo{
font-size:28px;
font-weight:800;
background:linear-gradient(
45deg,
var(--primary),
var(--secondary));
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

nav ul{
display:flex;
gap:30px;
list-style:none;
}

nav a{
text-decoration:none;
color:white;
font-weight:600;
transition:.3s;
}

nav a:hover{
color:var(--secondary);
}

/* HERO */

.hero{
min-height:100vh;
display:flex;
align-items:center;
justify-content:space-between;
padding:120px 8%;
}

.hero-content{
max-width:650px;
}

.badge{
display:inline-block;
padding:8px 20px;
border:1px solid var(--secondary);
border-radius:50px;
color:var(--secondary);
margin-bottom:20px;
}

.hero h1{
font-size:70px;
line-height:1;
margin-bottom:15px;
}

.hero h1 span{
background:linear-gradient(
45deg,
var(--primary),
var(--pink));
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.hero h2{
color:var(--text2);
margin-bottom:25px;
}

.hero p{
line-height:1.8;
color:var(--text2);
margin-bottom:35px;
}

.buttons{
display:flex;
gap:20px;
}

.btn{
padding:15px 35px;
border-radius:50px;
font-weight:700;
text-decoration:none;
}

.btn-primary{
background:linear-gradient(
45deg,
var(--primary),
var(--secondary));
color:white;
}

.btn-secondary{
border:2px solid var(--secondary);
color:white;
}

/* IMAGE */

.hero-image{
width:380px;
height:380px;
border-radius:50%;
overflow:hidden;
position:relative;
}

.hero-image::before{
content:'';
position:absolute;
inset:-8px;
background:linear-gradient(
45deg,
var(--primary),
var(--secondary),
var(--pink));
z-index:-1;
animation:rotate 5s linear infinite;
}

@keyframes rotate{
100%{
transform:rotate(360deg);
}
}

.hero-image img{
width:100%;
height:100%;
object-fit:cover;
border-radius:50%;
}

/* SECTION */

section{
padding:100px 8%;
}

.section-title{
font-size:45px;
margin-bottom:60px;
text-align:center;
}

.section-title span{
color:var(--secondary);
}

/* GLASS CARD */

.card{
background:rgba(255,255,255,.03);
backdrop-filter:blur(15px);
padding:35px;
border-radius:20px;
border:1px solid rgba(255,255,255,.08);
transition:.4s;
}

.card:hover{
transform:translateY(-10px);
box-shadow:
0 0 25px rgba(124,58,237,.5);
}
